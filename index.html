<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>25Archive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: acid-green landing with two dropdown menus flanking the logo; white sub-pages with a centred grid, BACK top right, click-to-open popups. */
:root{
  --green:#93fe55;
  --ink:#0d0d0d;
  --paper:#ffffff;
  --logo:#151313;
  --pill:rgba(255,255,255,.42);
  --pill-line:rgba(255,255,255,.7);
  --card-line:#e6e6e6;
  --mono:"Courier New",Courier,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--mono);font-weight:700;
  background:var(--paper);color:var(--ink);
  --page:var(--paper);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background-color .25s ease;
}
body[data-page="main"]{background:var(--green);--page:var(--green)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* header */
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
  padding:22px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font-size:13px;letter-spacing:.01em;pointer-events:none}
.top>*{pointer-events:auto}
.top .l{justify-self:start}.top .c{justify-self:center}.top .r{justify-self:end}
.top .r.is-back{cursor:pointer;font-size:14px}

.mini{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:46%;width:38px;z-index:4}
.mini svg,.logo svg{display:block;width:100%;height:auto;overflow:visible}
.mini img,.logo img{display:block;width:100%;height:auto}
.mini,.logo{mix-blend-mode:multiply}
.logo-fill{fill:var(--logo)}.logo-hole{fill:var(--page)}.logo-dot{fill:#fff}.logo-notch{stroke:var(--page);stroke-width:9;fill:none}

/* main */
/* positions measured from the original landing page (centres as % of the screen) */
.main{position:relative;height:100dvh}
.logo{position:absolute;left:49.8%;top:49.8%;transform:translate(-50%,-50%);width:clamp(140px,14.9vw,240px)}
.menu{position:absolute;transform:translate(-50%,-50%);text-align:center}
.menu[data-menu="l"]{left:24.9%;top:45.9%}
.menu[data-menu="r"]{left:78.7%;top:45.3%}
.menu .label{font-size:clamp(20px,1.95vw,26px);padding:6px 16px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
/* folder menu: ARCHIVE / SLDR open a 3D stack of folders over a blurred landing page */
.menu.open{z-index:12}
.fm{position:fixed;inset:0;z-index:10;perspective:1500px;perspective-origin:50% 38%;animation:fade .2s ease}
.fm[hidden]{display:none!important}
.fm-bg{position:absolute;inset:0;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.fm-stack{position:absolute;left:50%;top:60%;width:0;height:0;transform-style:preserve-3d}
.fm-stack a{position:absolute;left:0;top:0;width:var(--fw);margin:calc(var(--fw)*-.5) 0 0 calc(var(--fw)*-.5);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:clamp(14px,1.45vw,19px);
  transform:translate3d(var(--x),var(--y),var(--z)) rotateY(-40deg);transition:transform .3s cubic-bezier(.2,.8,.2,1);animation:fin .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n)*70ms)}
.fm-stack a:hover,.fm-stack a:focus-visible{transform:translate3d(var(--x),calc(var(--y) - 10px),calc(var(--z) + 90px)) rotateY(-8deg)}
.fm-stack img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.22));-webkit-user-drag:none}
.fm-stack .nm{padding:3px 12px;border-radius:999px;outline:1px solid transparent;transition:background-color .15s ease,outline-color .15s ease}
.fm-stack a:hover .nm,.fm-stack a:focus-visible .nm{background:var(--pill);outline-color:var(--pill-line)}
@keyframes fin{from{opacity:0;transform:translate3d(calc(var(--x) + 160px),calc(var(--y) - 60px),calc(var(--z) - 360px)) rotateY(-40deg)}to{opacity:1;transform:translate3d(var(--x),var(--y),var(--z)) rotateY(-40deg)}}

/* music pill */
.mp{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:11;display:flex;align-items:center;gap:14px;height:54px;padding:0 24px 0 18px;border-radius:999px;background:#050505;color:#fff;font-size:17px;line-height:1;box-shadow:0 12px 32px rgba(0,0,0,.18);white-space:nowrap}
.mp-btn{width:30px;height:30px;display:grid;place-items:center;transition:transform .15s ease}
.mp-btn:hover{transform:scale(1.06)}
.mp-btn:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:6px}
.mp{transition:opacity .2s ease}
body.popup .mp{opacity:0;pointer-events:none}
.pw{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(255,255,255,.12)}
.pw.on{display:flex}
.pw p{margin:0;font-weight:700;font-size:18px;letter-spacing:.04em;color:#000;text-transform:uppercase}
.pw-tab{width:min(300px,80vw);height:50px;background:none;border:0;display:flex;align-items:center;padding:0 22px}
.pw-tab input{all:unset;width:100%;text-align:center;font:inherit;font-weight:700;font-size:18px;letter-spacing:.12em;color:#000}
.pw-tab.bad{animation:pwshake .35s}
@keyframes pwshake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.plq{display:flex;flex-direction:column;align-items:center;gap:clamp(34px,6vh,60px);padding-top:clamp(6px,2vh,20px);width:100%}
.plq-b{display:block;width:min(400px,78vw);cursor:pointer;transition:transform .18s ease}
.plq-b:hover{transform:translateY(-3px)}
.plq-b img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.22))}
.idp{position:fixed;inset:0;z-index:25;display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(255,255,255,.62);cursor:zoom-out}
.idp.on{display:block;animation:fade .2s ease}
.idx{position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));z-index:2;font:inherit;font-weight:700;font-size:14px;letter-spacing:.04em;background:none;border:0;padding:6px 0;cursor:pointer;color:#000}
.idc{max-width:600px;margin:0 auto;padding:clamp(64px,11vh,100px) 22px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:clamp(44px,8vh,72px)}
.idb{width:100%;cursor:default}
.idt{margin:0;text-align:center;font-weight:700;font-size:clamp(26px,5vw,34px);letter-spacing:.06em}
.idpara{margin:0;font-weight:700;font-size:14px;line-height:1.6}
.idimgs{display:flex;flex-direction:column;align-items:center;gap:clamp(22px,4vh,34px)}
.idimgs img{display:block;width:min(100%,340px);height:auto}
.idlogo{text-align:center}.idlogo img{width:clamp(200px,52vw,290px);height:auto}
.idg{text-align:center}.idg img{width:min(100%,420px);height:auto}.idg img.mul{mix-blend-mode:multiply}
.idd{font-weight:700;font-size:13px;line-height:1.55;letter-spacing:.01em;display:flex;flex-direction:column;gap:clamp(26px,4.5vh,38px)}
.idd p{margin:0}.idd .big2{font-size:clamp(24px,5vw,32px);line-height:1.05;letter-spacing:.01em}.idd .mid{font-size:clamp(17px,3.6vw,22px);line-height:1.15}
.mp-v{position:relative;display:grid;place-items:center;width:28px;height:30px}
.mp-vb{width:28px;height:30px;display:grid;place-items:center;opacity:.85}
.mp-vb:hover{opacity:1}
.mp-vp{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%);width:42px;height:150px;border-radius:21px;background:rgba(30,30,30,.38);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);display:none;touch-action:none;cursor:pointer}
.mp-vp.on{display:block}
.mp-vt{position:absolute;left:50%;top:14px;bottom:14px;width:4px;margin-left:-2px;border-radius:4px;background:rgba(255,255,255,.3)}
.mp-vf{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:#fff}
.mp-vk{position:absolute;left:50%;width:14px;height:14px;margin:0 0 -7px -7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mp-t{color:rgba(255,255,255,.6);min-width:3.4ch;text-align:right;font-variant-numeric:tabular-nums}

/* illustrations: rotating 3D ring */
.sub{overflow-x:hidden}
.ring-stage{position:relative;width:100vw;margin:clamp(8px,3vh,32px) 0 0 calc(50% - 50vw);perspective:1150px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.ring-stage.drag{cursor:grabbing}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.item.rc{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.3333);aspect-ratio:auto;margin:calc(var(--cw)*-.6667) 0 0 calc(var(--cw)*-.5);
  transform:rotateY(calc(var(--i)*var(--step))) translateZ(var(--R));backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .3s ease;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.item.rc:hover{transform:rotateY(calc(var(--i)*var(--step))) translateZ(calc(var(--R) + 28px))}
.item.rc img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.num{position:fixed;left:max(70px,calc(env(safe-area-inset-left,0px) + 54px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:15px}

/* sub-pages */
.sub{min-height:100dvh;padding-block:clamp(80px,10vh,104px) 112px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:820px}
.tag{display:inline-block;background:#000;color:#fff;padding:5px 8px;line-height:1.15;font-size:15px;letter-spacing:.01em;margin-bottom:clamp(20px,3.5vh,36px)}
.grid{display:grid;gap:clamp(28px,5vw,56px) clamp(20px,4vw,48px)}
.g-garments{grid-template-columns:repeat(4,minmax(0,1fr));max-width:760px;margin-inline:auto;gap:clamp(8px,2vw,24px)}
.objs{display:flex;flex-direction:column;align-items:center;gap:clamp(24px,5vh,56px);width:100%}
.item.obj{aspect-ratio:auto;width:min(var(--ow),100%);height:auto}
.item.obj img{height:auto}
.g-posters{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-posters{display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,56px);align-items:flex-start}
.g-posters .item{aspect-ratio:auto;width:auto;max-width:100%;height:clamp(260px,56vh,480px)}
.g-posters .item img{width:auto;max-width:100%;height:100%;object-fit:contain}
.g-identity{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-illus{grid-template-columns:repeat(3,minmax(0,1fr))}
.item{display:block;width:100%;aspect-ratio:1/1;transition:transform .18s ease}
.item:hover{transform:translateY(-3px)}
.item svg,.item img,.ph{width:100%;height:100%;display:block;object-fit:contain}
.item.tall{aspect-ratio:3/4}.item.wide{aspect-ratio:4/3}
.ph{display:grid;place-items:center;font-size:12px;color:var(--ink);text-align:center;position:relative;overflow:hidden}
.ph span{position:relative;z-index:1;padding:6px;background:rgba(255,255,255,.55)}
.ph svg{position:absolute;inset:12%;width:76%;height:76%;opacity:.9}
.sec{margin-top:clamp(48px,7vh,80px);display:flex;flex-direction:column;align-items:center;gap:18px}
.sec .row{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,3vw,32px);width:100%}
.sec .row .item{width:clamp(96px,16vw,150px);aspect-ratio:1/3.4}
.sec .row .item.card{width:clamp(130px,26vw,310px);aspect-ratio:4/3}
.cap-s{font-size:11px;text-align:center}
.cap-m{font-size:20px;text-align:center}

/* illustrations: packed mosaic + spaced concepts */
.wrap.wide{max-width:940px}
.mosaic{--w:min(calc(100vw - 32px),940px);width:var(--w);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.mosaic .item{aspect-ratio:3/4;width:100%;height:auto;transition:filter .15s ease}
.mosaic .item img{object-fit:cover}
.mosaic .item:hover{transform:none;filter:brightness(1.08)}
.concepts{margin-top:clamp(28px,5vh,56px)}
.concepts .lbl{font-size:12px;margin:0 0 40px}
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,3vw,32px);align-items:start}
.cgrid .item{aspect-ratio:auto;height:auto}
.cgrid .item img{height:auto}
.citem{display:flex;flex-direction:column;align-items:center;gap:12px}
.citem .item{aspect-ratio:auto;width:var(--cw);height:var(--ch)}
.cap-xs{font-size:8px;letter-spacing:.02em;text-align:center}

/* people: one photo per row, centred */
.ptitle{margin:clamp(32px,6vh,64px) 0 clamp(36px,6vh,64px);font-size:clamp(16px,2vw,22px);font-weight:700;text-align:center;letter-spacing:.02em}
.others{margin-top:clamp(56px,9vh,90px);display:flex;flex-direction:column;align-items:center}
.others .tag{margin-bottom:22px}
.others p{margin:0;font-size:15px;line-height:1.7;text-align:center}
.plist{display:flex;flex-direction:column;align-items:center;gap:clamp(36px,6vh,64px)}
.item.pimg{aspect-ratio:auto;width:min(400px,78vw);height:auto}
.item.pimg{overflow:hidden}
.item.pimg img{height:auto;object-fit:cover;filter:blur(12px);transform:scale(1.1)}
.pbox{position:fixed;inset:0;z-index:21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;animation:fade2 .25s ease;cursor:zoom-out}
.pbox[hidden]{display:none!important}
.pbox img{display:block;max-width:min(92vw,560px);max-height:66dvh;width:auto;height:auto;box-shadow:0 12px 50px rgba(0,0,0,.2)}
.pbox .pn{margin:0 0 -14px;font-size:17px;letter-spacing:.02em}
.pbox p{max-width:min(92vw,560px);margin:0;font-size:15px;line-height:1.5;text-align:center;white-space:pre-line}
.pbox p[hidden]{display:none}

/* popup */
.pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .18s ease}
.pop[hidden]{display:none!important}
.pop.bare{cursor:zoom-out}.pop.bare .card{display:none}
.big{position:fixed;inset:0;margin:auto;z-index:21;max-width:min(92vw,900px);max-height:90dvh;width:auto;height:auto;animation:fade2 .25s ease;cursor:zoom-out}
.big.mul{mix-blend-mode:multiply}
.big.raw{box-shadow:0 12px 50px rgba(0,0,0,.2)}
.big[hidden]{display:none!important}
@keyframes fade2{from{opacity:0}to{opacity:1}}
.card{background:#fff;width:min(820px,100%);height:min(88dvh,900px);border:1px solid var(--card-line);border-radius:18px;box-shadow:0 10px 50px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(24px,5vw,56px);animation:rise .22s ease}
.card .art{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.card .art>*{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.card:focus,.card:focus-visible{outline:none}
.card .cap{font-size:15px;text-align:center;padding-top:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:760px){
  .logo{left:50%;top:30%;width:min(52vw,210px)}
  .menu[data-menu="l"]{left:27%;top:56%}
  .menu[data-menu="r"]{left:73%;top:56%}
  .fm-stack{top:69%}
  .mp{height:50px;font-size:16px;gap:12px}
  .g-garments,.g-posters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mini{width:26px;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .num{left:max(52px,calc(env(safe-area-inset-left,0px) + 40px))}
}
</style>

</head>
<body>

<header class="top">
  <a class="l" href="#main" id="name">Carel Gumuyire</a>
  <div class="c">25Archive</div>
  <div class="r" id="right">Portfolio</div>
</header>
<a class="mini" href="#main" aria-label="25Archive home"><img src="Sldrlogo.png" alt="25Archive home" width="38"></a>
<main id="view"></main>
<div class="fm" id="fm" hidden><div class="fm-bg"></div><nav class="fm-stack" id="fmRow" aria-label="Folders"></nav></div>

<div class="pop" id="pop" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" tabindex="-1">
    <div class="art" id="popArt"></div>
    <div class="cap" id="popCap"></div>
  </div>
</div>
<img class="big" id="big" alt="" hidden>
<div class="idp" id="idp"><button class="idx" id="idx" type="button">CLOSE</button><div class="idc" id="idc"></div></div>
<div class="pw" id="pw"><p id="pwL">Enter password</p><div class="pw-tab" id="pwT"><input id="pwI" type="password" autocomplete="off" spellcheck="false" aria-label="Enter password"></div></div>
<div class="mp" id="mp"><button class="mp-btn" id="mpBtn" aria-label="Play"></button><span>Listening</span><div class="mp-v" id="mpV"><button class="mp-vb" id="mpVb" aria-label="Volume"></button><div class="mp-vp" id="mpVp"><div class="mp-vt" id="mpVt"><div class="mp-vf" id="mpVf"></div><div class="mp-vk" id="mpVk"></div></div></div></div><span class="mp-t" id="mpT">0:00</span></div>
<div class="pbox" id="pbox" hidden><img id="pimg" alt=""><p class="pn" id="pname"></p><p id="pwords" hidden></p></div>

<script>
(function(){
  /* >>> put your folder image's file name between the quotes (PNG or JPG; a white background is removed automatically) <<< */
  var PREVIEW=false,FOLDER_SRC='FOLDERCOM.jpg',FOLDER_URL='FOLDERCOM.jpg';
  var PCOL=['#c9341f','#2c3f8f','#e8742f','#5f9e77','#7a1f12','#3b3a37','#cf2f5a','#8b6b44','#2f5a32','#e8e048','#6b5fb5','#d9a02f','#1b6f8a','#a3281a'];
  function phImg(n,bg,shape){
    n=String(n).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    var sv='<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect width="600" height="800" fill="'+bg+'"/>'+(shape?'<ellipse cx="300" cy="380" rx="190" ry="130" fill="#222"/><rect x="190" y="470" width="220" height="40" rx="8" fill="#b33"/>':'<rect x="110" y="150" width="380" height="500" fill="rgba(255,255,255,.28)"/>')+'<text x="300" y="730" font-family="Courier New,monospace" font-weight="700" font-size="30" text-anchor="middle" fill="'+(shape?'#111':'#fff')+'">'+n+'</text></svg>';
    return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(sv)));
  }
  function pvTile(o){var c={},k,h=0,i;for(k in o)c[k]=o[k];for(i=0;i<o.n.length;i++)h+=o.n.charCodeAt(i);c.img=phImg(o.n,o.cut?'#ffffff':PCOL[h%PCOL.length],!!o.cut);return c}
  var INK="#151313";
  /* the logo, drawn inline everywhere it appears */
  var SH='<ellipse class="logo-fill" cx="190" cy="138" rx="188" ry="136" transform="rotate(6 190 138)"/><ellipse class="logo-hole" cx="232" cy="64" rx="112" ry="34" transform="rotate(15 232 64)"/><ellipse class="logo-hole" cx="89" cy="136" rx="68" ry="60" transform="rotate(25 89 136)"/><ellipse class="logo-hole" cx="250" cy="190" rx="96" ry="64" transform="rotate(-20 250 190)"/><path class="logo-notch" d="M22 84 L44 66"/><ellipse class="logo-dot" cx="184" cy="122" rx="12" ry="9"/>';
  var S=function(x){return '<svg viewBox="0 0 120 120" aria-hidden="true">'+x+'</svg>'};

        pop.classList.add('bare');pop.hidden=false;big.hidden=false;
      });
    }else if(o.img){
      big.src=encodeURI(o.img);big.alt=o.n;big.classList.remove('mul');big.classList.add('raw');

    }else{

    }
  }
  function closePop(){token++;if(pop.hidden)return;pop.hidden=true;big.hidden=true;pbox.hidden=true;document.body.classList.remove('popup');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
  pop.addEventListener('click',function(e){if(pop.classList.contains('bare')||!card.contains(e.target))closePop()});
  big.addEventListener('click',closePop);pbox.addEventListener('click',closePop);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closePop();closeFm()}});

  FOLDER_URL=FOLDER_SRC;cutout(encodeURI(FOLDER_SRC),false,function(u,fb){if(!fb)FOLDER_URL=u});
